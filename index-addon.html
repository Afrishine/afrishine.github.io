<!-- ===== AFRISHINE: upload rules add-on =====
     Paste this whole <script> block in index.html, right BEFORE the line:
         <link rel="stylesheet" href="creator-dashboard.css">
     It does not replace any existing code. It only wraps a few existing functions. -->
<script id="afrishine-upload-rules-addon">
(function () {
  'use strict';
  try {
    var W = 'https://afrishine-media.usherluckyelie.workers.dev';
    var MAX = 100 * 1024 * 1024, MAXSEC = 300;
    var MSG_VERIFY = 'Please complete your account verification first, then come back here to upload your video. You can also wait one week to upload without verification';
    var MSG_DAILY = 'Today, you have successfully uploaded your video. You can upload another one tomorrow.';
    var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var mb = function (n) { return (n / 1048576).toFixed(1) + ' MB'; };
    var BTN = 'display:block;width:100%;margin:0 0 10px;min-height:50px;border-radius:14px;font-size:16px';

    /* 1) The quota popup uses the exact verification message. */
    window.AF_QUOTA_MESSAGE = MSG_VERIFY;

    /* 2) Every popup button says "Back". */
    var oPopup = window.afPopup;
    if (typeof oPopup === 'function') {
      window.afPopup = function (o) {
        oPopup(o);
        var b = document.querySelector('#afGateModal .gate-cancel');
        if (b) b.textContent = 'Back';
      };
    }

    /* 3) Understand the new Worker error codes. */
    var oFail = window.afWorkerFailure;
    window.afWorkerFailure = function (d, status) {
      var c = d && d.code;
      if (c === 'VERIFICATION_REQUIRED') return window.afPopup({ icon: '📦', message: MSG_VERIFY });
      if (c === 'DAILY_VIDEO_LIMIT') return window.afPopup({ icon: '⏳', message: MSG_DAILY });
      if (c === 'VIDEO_TOO_LONG') return window.afPopup({ icon: '🛠️', title: 'Edit needed', message: d.error });
      if (c === 'UPLOAD_IN_PROGRESS' || c === 'STORAGE_TOTAL_FULL' || c === 'UPLOAD_EXPIRED' || c === 'EMAIL_NOT_VERIFIED') return window.afPopup({ icon: '📦', message: d.error });
      return oFail && oFail(d, status);
    };

    /* 4) Ask the Worker BEFORE the user spends time converting a video. */
    function getUsage() {
      var u = (typeof currentFirebaseUser !== 'undefined') ? currentFirebaseUser : null;
      if (!u) return Promise.resolve(null);
      return u.getIdToken().then(function (t) { return fetch(W + '/usage', { headers: { Authorization: 'Bearer ' + t } }); })
        .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }
    function precheck() {
      return getUsage().then(function (d) {
        var msg = '';
        if (d && d.dailyVideoUsed) msg = MSG_DAILY;
        else if (d && d.blockReason === 'VERIFICATION_REQUIRED') msg = MSG_VERIFY;
        else if (d && d.blockReason === 'STORAGE_TOTAL_FULL') msg = d.message;
        if (msg) { window.afPopup({ icon: msg === MSG_DAILY ? '⏳' : '📦', message: msg }); throw new Error(msg); }
      });
    }

    /* 5) Upload preparation screen for videos above 100 MB. */
    function pickMime() {
      var l = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
      for (var i = 0; i < l.length; i++) { try { if (MediaRecorder.isTypeSupported(l[i])) return l[i]; } catch (_) { } }
      return '';
    }
    function recordSegment(file, start, end, bps, onStatus) {
      return new Promise(function (resolve, reject) {
        if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) { reject(new Error('Your browser cannot cut videos. Please choose another video under 100 MB.')); return; }
        var url = URL.createObjectURL(file), v = document.createElement('video'), done = false, rec, chunks = [], ac, stream, raf = 0, timer, c, ctx;
        v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
        v.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
        document.body.appendChild(v);
        function cleanup() {
          clearInterval(timer); if (raf) cancelAnimationFrame(raf);
          try { v.pause(); } catch (_) { }
          try { if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); } catch (_) { }
          try { if (ac && ac.state !== 'closed') ac.close(); } catch (_) { }
          try { v.removeAttribute('src'); v.load(); } catch (_) { }
          if (v.parentNode) v.parentNode.removeChild(v);
          URL.revokeObjectURL(url);
        }
        function fail(m) {
          if (done) return; done = true;
          try { if (rec && rec.state !== 'inactive') { rec.onstop = null; rec.stop(); } } catch (_) { }
          cleanup(); reject(new Error(m));
        }
        function draw() { if (done) return; try { ctx.drawImage(v, 0, 0, c.width, c.height); } catch (_) { } raf = requestAnimationFrame(draw); }
        v.onerror = function () { fail('This video could not be read. Please choose another video.'); };
        v.onloadedmetadata = function () {
          if (!v.videoWidth) { fail('This video could not be read. Please choose another video.'); return; }
          var scale = Math.min(1, 1920 / Math.max(v.videoWidth, v.videoHeight));
          c = document.createElement('canvas');
          c.width = Math.max(2, Math.round(v.videoWidth * scale / 2) * 2);
          c.height = Math.max(2, Math.round(v.videoHeight * scale / 2) * 2);
          ctx = c.getContext('2d', { alpha: false });
          stream = c.captureStream(30);
          try {
            var AC = window.AudioContext || window.webkitAudioContext;
            ac = new AC(); if (ac.resume) ac.resume();
            var src = ac.createMediaElementSource(v), dest = ac.createMediaStreamDestination();
            src.connect(dest);
            dest.stream.getAudioTracks().forEach(function (t) { stream.addTrack(t); });
          } catch (_) { /* no audio */ }
          var mime = pickMime();
          try { rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: bps, audioBitsPerSecond: 128000 } : { videoBitsPerSecond: bps }); }
          catch (_) { fail('Your browser cannot cut this video. Please choose another video.'); return; }
          var type = (rec.mimeType || mime || 'video/webm').split(';')[0];
          rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
          rec.onstop = function () {
            if (done) return; done = true;
            var blob = new Blob(chunks, { type: type }); cleanup();
            if (!blob.size) { reject(new Error('The cut video came out empty. Please try again.')); return; }
            var base = (file.name || 'video').replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9._-]/g, '_').slice(0, 50) || 'video';
            resolve(new File([blob], base + '-cut' + (type === 'video/mp4' ? '.mp4' : '.webm'), { type: type, lastModified: Date.now() }));
          };
          v.onseeked = function () {
            v.onseeked = null;
            rec.start(1000);
            v.play().then(draw).catch(function () { fail('Your browser blocked the cut. Please tap "Make the cut" again.'); });
            timer = setInterval(function () {
              var p = Math.round((v.currentTime - start) / (end - start) * 100);
              if (onStatus) onStatus('Cutting… ' + Math.max(0, Math.min(99, p)) + '%');
              if (v.currentTime >= end || v.ended) { clearInterval(timer); v.pause(); setTimeout(function () { if (rec.state !== 'inactive') rec.stop(); }, 250); }
            }, 250);
          };
          v.currentTime = start;
        };
        v.src = url;
      });
    }

    function prepScreen(file, onStatus, prep) {
      return new Promise(function (resolve, reject) {
        var cur = file, o = document.createElement('div'), previewUrl = null;
        o.id = 'afPrepScreen'; o.className = 'gate-overlay'; o.style.zIndex = '99999';
        o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
        document.body.appendChild(o);
        function close() { if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; } if (o.parentNode) o.parentNode.removeChild(o); }
        function cancel() { close(); reject(new Error('Upload cancelled.')); }
        function busy(text) {
          o.innerHTML = '<section class="gate-card"><div class="gate-icon" aria-hidden="true">⏳</div><h2>Please wait</h2><p id="afPrepStatus">' + esc(text) + '</p><p style="font-size:13px">Keep this screen open.</p></section>';
          return function (t) { var p = document.getElementById('afPrepStatus'); if (p) p.textContent = t; if (onStatus) onStatus(t); };
        }
        function home(note) {
          o.innerHTML = '<section class="gate-card" style="max-height:92vh;overflow:auto"><div class="gate-icon" aria-hidden="true">🎬</div><h2>Prepare your video</h2><p>' +
            esc(note || ('This video is ' + mb(cur.size) + '. The limit is 100 MB. Choose how to continue.')) + '</p>' +
            '<button type="button" class="gold" style="' + BTN + '" data-a="cut">✂️ Cut Video</button>' +
            '<button type="button" class="secondary" style="' + BTN + '" data-a="replace">🔁 Replace Video</button>' +
            '<button type="button" class="secondary" style="' + BTN + '" data-a="compress">🗜️ Compress / Convert Video</button>' +
            '<button type="button" class="gate-cancel" data-a="back">Back</button>' +
            '<input type="file" accept="video/*" id="afPrepFile" style="display:none"></section>';
        }
        function finish(f) { close(); resolve(f); }
        function afterEdit(f) {
          if (f.size > MAX) { cur = f; home('The result is still ' + mb(f.size) + ', above the 100 MB limit. Cut a shorter part, replace the video, or try compressing.'); return; }
          finish(f);
        }
        function cutView() {
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(cur);
          o.innerHTML = '<section class="gate-card" style="max-height:92vh;overflow:auto;text-align:left"><h2 style="text-align:center">✂️ Cut Video</h2>' +
            '<video id="afCutVideo" controls playsinline src="' + previewUrl + '" style="width:100%;max-height:30vh;border-radius:12px;background:#000"></video>' +
            '<p id="afCutInfo" style="margin:10px 0 6px;font-size:14px">Reading video length…</p>' +
            '<label style="font-size:13px;color:#aab2c5">Start time (seconds)</label><input class="field" id="afCutS" type="number" min="0" step="0.1" value="0" inputmode="decimal">' +
            '<label style="font-size:13px;color:#aab2c5">End time (seconds)</label><input class="field" id="afCutE" type="number" min="0" step="0.1" inputmode="decimal">' +
            '<div style="display:flex;gap:8px;margin-bottom:10px"><button type="button" class="secondary" style="flex:1" id="afCutSetS">Start = now</button><button type="button" class="secondary" style="flex:1" id="afCutSetE">End = now</button></div>' +
            '<p id="afCutMsg" style="font-size:13.5px;color:#ffcf54;min-height:18px;margin:0 0 10px"></p>' +
            '<button type="button" class="gold" style="' + BTN + '" id="afCutGo">Make the cut</button>' +
            '<button type="button" class="gate-cancel" id="afCutBack">Back</button></section>';
          var vid = document.getElementById('afCutVideo'), S = document.getElementById('afCutS'), E = document.getElementById('afCutE'), info = document.getElementById('afCutInfo'), msg = document.getElementById('afCutMsg');
          var dur = 0;
          vid.onloadedmetadata = function () {
            dur = vid.duration;
            if (!isFinite(dur) || dur <= 0) { info.textContent = 'The length of this video cannot be read. Please use Compress or Replace instead.'; return; }
            info.textContent = 'Length: ' + dur.toFixed(1) + ' s · Size: ' + mb(cur.size) + ' · Pick up to 5 minutes.';
            E.value = Math.min(dur, MAXSEC).toFixed(1);
          };
          vid.onerror = function () { info.textContent = 'This video cannot be previewed here. Please use Compress or Replace instead.'; };
          document.getElementById('afCutSetS').onclick = function () { S.value = vid.currentTime.toFixed(1); };
          document.getElementById('afCutSetE').onclick = function () { E.value = vid.currentTime.toFixed(1); };
          document.getElementById('afCutBack').onclick = function () { home(); };
          document.getElementById('afCutGo').onclick = function () {
            var s = parseFloat(S.value), e = parseFloat(E.value);
            if (!dur || !isFinite(s) || !isFinite(e) || s < 0 || e <= s || e > dur + 0.2) { msg.textContent = 'Enter a valid start and end time inside the video.'; return; }
            if (e - s > MAXSEC) { msg.textContent = 'The selected part is longer than 5 minutes.'; return; }
            var bps = Math.min(16000000, Math.floor((92 * 1048576 * 8 * 0.9) / (e - s) - 128000));
            if (bps < 800000) { msg.textContent = 'This part is too long to fit under 100 MB. Choose a shorter part.'; return; }
            var st = busy('Cutting… 0%');
            recordSegment(cur, s, Math.min(e, dur), bps, st).then(afterEdit).catch(function (err) { home(err.message); });
          };
        }
        o.addEventListener('click', function (ev) {
          var b = ev.target.closest ? ev.target.closest('[data-a]') : null; if (!b) return;
          var a = b.getAttribute('data-a');
          if (a === 'back') cancel();
          else if (a === 'cut') cutView();
          else if (a === 'replace') document.getElementById('afPrepFile').click();
          else if (a === 'compress') {
            var st = busy('Optimizing video… 0%');
            prep(cur, st).then(finish).catch(function () { home('The video could not be compressed. Try cutting a shorter part or replace it.'); });
          }
        });
        o.addEventListener('change', function (ev) {
          if (!ev.target || ev.target.id !== 'afPrepFile') return;
          var f = ev.target.files && ev.target.files[0]; if (!f) return;
          if (f.size > MAX) { cur = f; home('That video is ' + mb(f.size) + ', still above 100 MB. Choose a smaller one, or cut / compress it.'); return; }
          close();
          prep(f, onStatus).then(resolve, reject);
        });
        home();
      });
    }

    var oPrep = window.afPrepareVideo;
    if (typeof oPrep === 'function') {
      window.afPrepareVideo = function (file, onStatus) {
        return precheck().then(function () {
          return file.size > MAX ? prepScreen(file, onStatus, oPrep) : oPrep(file, onStatus);
        });
      };
    }

    /* 6) Admin dashboard > Storage: show every number the Worker reports. */
    function gb(n) { return (Number(n || 0) / 1e9).toFixed(2) + ' GB'; }
    function dateText(s) { return s ? esc(s) : '—'; }
    function renderStorage(box) {
      getUsage().then(function (d) {
        if (!d || d.dbConnected === false) { box.innerHTML = '<p class="adm-empty">Storage numbers are not available right now. Check that the D1 database is bound to the Worker.</p>'; return; }
        var pct = Math.min(100, Math.round((d.usedBytes || 0) / (d.allowanceBytes || 1) * 100));
        var cell = function (icon, val, label) { return '<div class="adm-stat"><i>' + icon + '</i><b>' + esc(val) + '</b><small>' + esc(label) + '</small></div>'; };
        box.innerHTML =
          '<div class="adm-stat"><small>Monthly upload allowance used</small><b>' + gb(d.usedBytes) + ' / ' + gb(d.allowanceBytes) + '</b><div class="adm-bar"><span style="width:' + pct + '%"></span></div>' +
          '<small style="margin-top:8px">' + pct + '% used · uploads ' + (d.canUpload === false ? 'are paused for unverified members' : 'are open') + '</small></div>' +
          '<div class="adm-grid" style="margin-top:10px">' +
          cell('🗄️', gb(d.capacityBytes), 'Total R2 capacity') +
          cell('📦', gb(d.allowanceBytes), 'Monthly upload allowance') +
          cell('⬆️', gb(d.usedBytes), 'Used uploads this cycle') +
          cell('🟢', gb(d.remainingBytes), 'Remaining upload allowance') +
          cell('📅', d.cycleStartDate || '—', 'Billing cycle start') +
          cell('🔁', d.nextResetDate || '—', 'Next reset date') +
          cell('⛔', d.blockedUsers == null ? '—' : d.blockedUsers, 'Members blocked by the upload limit') +
          cell('✅', d.verifiedContinuing == null ? '—' : d.verifiedContinuing, 'Verified members still uploading') +
          cell('🗃️', gb(d.totalStoredBytes), 'Total stored in R2') +
          cell('📁', d.objectCount == null ? '—' : d.objectCount, 'Files recorded') + '</div>' +
          '<p class="adm-empty">Cycle: ' + dateText(d.cycleStartDate) + ' to ' + dateText(d.nextResetDate) + ' (Africa/Kigali, 00:00 on the 6th). Files from earlier cycles are never deleted and still count toward the 10 GB capacity.</p>' +
          '<button type="button" class="adm-btn" id="afRecount">Recount real R2 storage</button> <button type="button" class="adm-btn" id="afStorRefresh">Refresh</button>';
        document.getElementById('afStorRefresh').onclick = function () { renderStorage(box); };
        document.getElementById('afRecount').onclick = function (ev) {
          var btn = ev.target; btn.disabled = true; btn.textContent = 'Counting…';
          currentFirebaseUser.getIdToken().then(function (t) { return fetch(W + '/admin/recount', { method: 'POST', headers: { Authorization: 'Bearer ' + t } }); })
            .then(function () { renderStorage(box); }).catch(function () { btn.disabled = false; btn.textContent = 'Recount real R2 storage'; });
        };
      });
    }
    function waitAndRender(n) {
      var b = document.getElementById('admBody'); if (!b) return;
      if (/New uploads this month|not available right now/.test(b.textContent || '')) { renderStorage(b); return; }
      if (n < 25) setTimeout(function () { waitAndRender(n + 1); }, 300);
    }
    document.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('[data-adm-tab="storage"]') : null;
      if (t) setTimeout(function () { waitAndRender(0); }, 400);
    }, true);
  } catch (err) { console.warn('Afrishine upload add-on not started:', err); }
})();
</script>
