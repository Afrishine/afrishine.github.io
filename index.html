
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a10">

  <title>Afrishine Hub | Your Hub, Your Solutions</title>

  <meta name="description"
    content="Discover Rwandan products, showcase talents, learn new skills and connect with the Afrishine Hub community.">

  <link rel="stylesheet" href="./css/style.css">

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body>

  <div class="app-container">

    <header class="app-header">

      <a href="#home" data-page="home" class="brand">
        <span class="brand-icon">🌍</span>
        <span>
          <strong>Afrishine Hub</strong>
          <small>Your Hub, Your Solutions</small>
        </span>
      </a>

      <div class="header-actions">
        <button class="btn btn-outline"
          onclick="window.openAuthModal && window.openAuthModal()">
          Sign In
        </button>
      </div>

    </header>

    <nav class="main-navigation">

      <a href="#home" data-page="home">🏠 Home</a>
      <a href="#talent" data-page="talent">🎨 Talent</a>
      <a href="#academy" data-page="academy">🎓 Academy</a>
      <a href="#shop" data-page="shop">🛍️ Shop</a>
      <a href="#jobs" data-page="jobs">💼 Jobs</a>
      <a href="#travel" data-page="travel">✈️ Travel</a>
      <a href="#wallet" data-page="wallet">👛 Wallet</a>
      <a href="#inbox" data-page="inbox">💬 Inbox</a>
      <a href="#profile" data-page="profile">👤 Profile</a>

    </nav>

    <main id="page-content">
      <div class="empty-state">
        <h2>Welcome to Afrishine Hub</h2>
        <p>Loading your experience...</p>
      </div>
    </main>

    <footer class="app-footer">
      <p>© 2026 Afrishine Hub · Built in Kigali, Rwanda 🇷🇼</p>
      <p>Your Hub, Your Solutions.</p>
    </footer>

    <nav class="mobile-navigation">

      <a href="#home" data-page="home">🏠<small>Home</small></a>
      <a href="#talent" data-page="talent">🎨<small>Talent</small></a>
      <a href="#shop" data-page="shop">🛍️<small>Shop</small></a>
      <a href="#inbox" data-page="inbox">💬<small>Inbox</small></a>
      <a href="#profile" data-page="profile">👤<small>Profile</small></a>

    </nav>

  </div>

  <script type="module">
    import "./js/firebase.js";
    import "./js/auth.js";
    import "./js/pi-auth.js";
    import "./js/feed.js";
    import "./js/video.js";
    import "./js/app.js";

    window.addEventListener("DOMContentLoaded", () => {
      if (window.AfrishineApp) {
        window.AfrishineApp.init();
      }
    });
  </script>

</body>
</html>
