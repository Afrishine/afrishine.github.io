<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Afrishine – Pi tester sign-in</title><meta name="robots" content="noindex">
<style>body{margin:0;background:#0b1020;color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px;box-sizing:border-box}
main{max-width:420px;text-align:center}h1{font-size:22px}p{color:#b8c0d8;line-height:1.5}
button{background:#ffb81c;color:#111;border:0;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:700;width:100%}
button:disabled{opacity:.6}#out{margin-top:16px;font-weight:600;word-break:break-word}</style></head>
<body><main>
<h1>Afrishine – Pi tester sign-in</h1>
<p>Open this page in <b>Pi Sandbox</b> (Pi Develop → Run in Sandbox), then press the button. It only registers your Pi username so the team can send you a small <b>Testnet</b> test payment. No money is taken from you.</p>
<button id="go" type="button">Sign in with Pi</button>
<div id="out"></div>
</main>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
(function(){
  var out=document.getElementById('out'), btn=document.getElementById('go');
  function say(t){out.textContent=t;}
  var inPi=/PiBrowser/i.test(navigator.userAgent||'');
  if(!inPi)say('⚠️ This does not look like Pi Browser. Open Pi Browser → Develop → your app → Run in Sandbox. Chrome cannot sign in with Pi.');
  btn.addEventListener('click',function(){
    if(!window.Pi){say('Open this page inside Pi Browser (Pi Develop → Run in Sandbox).');return;}
    btn.disabled=true;say('Opening Pi sign-in…');
    setTimeout(function(){if(out.textContent==='Opening Pi sign-in…'){say('Still waiting. Open this page from Pi Browser → Develop → Run in Sandbox (not from Chrome), then press the button again.');btn.disabled=false;}},15000);
    try{window.Pi.init({version:'2.0',sandbox:true});}catch(e){}
    Promise.resolve(window.Pi.authenticate(['username','payments'],function(){})).then(function(a){
      return fetch('/api/pi-a2u',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'tester',accessToken:a.accessToken})});
    }).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok||d.error)throw new Error(d.error||'Something went wrong.');return d;});})
    .then(function(d){say('✅ Registered: '+d.username+' (id '+(d.id||'')+'…). You can close this page.');})
    .catch(function(e){say('❌ '+(e&&e.message?e.message:'Sign-in failed.'));btn.disabled=false;});
  });
})();
</script></body></html>
